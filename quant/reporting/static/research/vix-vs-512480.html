    const max = Math.ceil((Math.max(...all) + 5) / 10) * 10;
    const startT = values[0].date.getTime(), endT = values.at(-1).date.getTime();
    const x = d => pad.left + (d.getTime() - startT) / (endT - startT) * innerW;
    const y = value => pad.top + (max - value) / (max - min) * innerH;
    // The chart is normalized to 100 at the shared start date, so map the raw
    // VIX thresholds into the same scale before drawing the 14–19 band.
    const vixThreshold = rawValue => rawValue / m.vixStart * 100;
    const vixBandTop = y(vixThreshold(19));
    const vixBandBottom = y(vixThreshold(14));
    const line = key => values.map((d, index) => `${index ? 'L' : 'M'}${x(d.date).toFixed(2)},${y(d[key]).toFixed(2)}`).join(' ');
    const yTicks = Array.from({length: 5}, (_, i) => min + (max - min) * i / 4);
    const monthTicks = [];
    let priorMonth = -1;
    values.forEach(d => { if (d.date.getUTCMonth() !== priorMonth) { monthTicks.push(d); priorMonth = d.date.getUTCMonth(); } });
    const displayTicks = width < 450 ? monthTicks.filter((_, i) => i % 2 === 0) : monthTicks;
    const downRunRects = downRuns.map(run => {
      const start = new Date(`${run.start}T00:00:00Z`);
      const end = new Date(`${run.end}T00:00:00Z`);
      const left = x(start);
      const right = x(end);
      const opacity = (0.10 + Math.min(0.20, Math.abs(run.change) / 190)).toFixed(2);
      const label = right - left > 42 ? `<text class="vix-down-run-label" x="${((left + right) / 2).toFixed(2)}" y="${height - pad.bottom - 6}" text-anchor="middle">${run.change.toFixed(0)}%</text>` : '';
      return `<rect class="vix-down-run" x="${left.toFixed(2)}" y="${pad.top}" width="${Math.max(2, right-left).toFixed(2)}" height="${innerH}" opacity="${opacity}" data-run-start="${run.start}" data-run-end="${run.end}"/>${label}`;
    }).join('');
    const upRunRects = upRuns.map(run => {
      const start = new Date(`${run.start}T00:00:00Z`);
      const end = new Date(`${run.end}T00:00:00Z`);
      const left = x(start);
      const right = x(end);
      const opacity = (0.10 + Math.min(0.20, Math.abs(run.change) / 165)).toFixed(2);
      const label = right - left > 42 ? `<text class="vix-up-run-label" x="${((left + right) / 2).toFixed(2)}" y="${pad.top + 13}" text-anchor="middle">+${run.change.toFixed(0)}%</text>` : '';
      return `<rect class="vix-up-run" x="${left.toFixed(2)}" y="${pad.top}" width="${Math.max(2, right-left).toFixed(2)}" height="${innerH}" opacity="${opacity}" data-run-start="${run.start}" data-run-end="${run.end}"/>${label}`;
    }).join('');
    const vixColor = parseColor('--viz-series-1');
    const etfColor = parseColor('--viz-series-2');
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('aria-label', `从 ${m.start} 到 ${m.end}，^VIX 与512480前复权价格的归一化走势。背景标出 ^VIX 连续至少三天收跌和收涨的区间。`);
    svg.innerHTML = `
      <title id="vix-chart-title">^VIX 与 SH.512480 的归一化走势</title>
      <desc id="vix-chart-desc">^VIX 与实际交易标的 SH.512480 在共同可用交易日上的归一化收盘走势；红色背景标出 ^VIX 连续至少三天收跌，绿色背景标出连续至少三天收涨。</desc>
      ${downRunRects}
      ${upRunRects}
      <rect class="vix-vix-band" x="${pad.left}" y="${vixBandTop}" width="${innerW}" height="${vixBandBottom-vixBandTop}"/>
      <line class="vix-vix-band-edge" x1="${pad.left}" x2="${width-pad.right}" y1="${vixBandTop}" y2="${vixBandTop}"/>
      <line class="vix-vix-band-edge" x1="${pad.left}" x2="${width-pad.right}" y1="${vixBandBottom}" y2="${vixBandBottom}"/>
      <text class="vix-vix-band-label" x="${pad.left+6}" y="${vixBandTop+15}">^VIX 原值 14–19 区间</text>
      ${yTicks.map(v => `<line class="vix-grid" x1="${pad.left}" x2="${width-pad.right}" y1="${y(v)}" y2="${y(v)}"/><text class="vix-axis" x="${pad.left-8}" y="${y(v)+4}" text-anchor="end">${v.toFixed(0)}</text>`).join('')}
      ${displayTicks.map(d => `<text class="vix-axis" x="${x(d.date)}" y="${height-15}" text-anchor="middle">${tickDate(d.date)}</text>`).join('')}
      <line class="vix-grid" x1="${pad.left}" x2="${pad.left}" y1="${pad.top}" y2="${height-pad.bottom}"/>
      <line class="vix-grid" x1="${pad.left}" x2="${width-pad.right}" y1="${height-pad.bottom}" y2="${height-pad.bottom}"/>
      <text class="vix-axis" x="${pad.left}" y="15">归一化收盘价（首日=100）</text>
      <path class="vix-vix-path" d="${line('vix')}"/>
      <path class="vix-etf-path" d="${line('etf')}"/>
      <text x="${width-pad.right}" y="${y(values.at(-1).vix)-20}" text-anchor="end" fill="${vixColor}" font-size="12">^VIX ${values.at(-1).vix.toFixed(1)}（${fmtPct(m.vixReturn)}）</text>
      <text x="${width-pad.right}" y="${y(values.at(-1).etf)+18}" text-anchor="end" fill="${etfColor}" font-size="12">512480 ${values.at(-1).etf.toFixed(1)}（${fmtPct(m.etfReturn)}）</text>
      <line class="vix-hover-line" hidden/>
      <circle class="vix-hover-dot vix-hover-vix" r="4" fill="${vixColor}" hidden/>
      <circle class="vix-hover-dot vix-hover-etf" r="4" fill="${etfColor}" hidden/>
      <rect class="vix-hit" x="${pad.left}" y="${pad.top}" width="${innerW}" height="${innerH}" fill="transparent"/>
    `;
    const hit = svg.querySelector('.vix-hit');
    const hoverLine = svg.querySelector('.vix-hover-line');
    const vixDot = svg.querySelector('.vix-hover-vix');
    const etfDot = svg.querySelector('.vix-hover-etf');
    const show = event => {
      const rect = svg.getBoundingClientRect();
      const pointX = (event.clientX - rect.left) / rect.width * width;
      const targetTime = startT + Math.max(0, Math.min(1, (pointX - pad.left) / innerW)) * (endT - startT);
      let low = 0, high = values.length - 1;
      while (low < high) { const mid = Math.floor((low + high) / 2); if (values[mid].date.getTime() < targetTime) low = mid + 1; else high = mid; }
      const right = values[low], left = values[Math.max(0, low - 1)];
      const selected = Math.abs(right.date.getTime() - targetTime) < Math.abs(left.date.getTime() - targetTime) ? right : left;
      const cx = x(selected.date);
      hoverLine.setAttribute('x1', cx); hoverLine.setAttribute('x2', cx); hoverLine.setAttribute('y1', pad.top); hoverLine.setAttribute('y2', height-pad.bottom); hoverLine.hidden = false;
      [[vixDot, selected.vix], [etfDot, selected.etf]].forEach(([dot, value]) => { dot.setAttribute('cx', cx); dot.setAttribute('cy', y(value)); dot.hidden = false; });
      const downRun = downRuns.find(run => selected.rawDate >= run.start && selected.rawDate <= run.end);
      const upRun = upRuns.find(run => selected.rawDate >= run.start && selected.rawDate <= run.end);
      const runText = downRun
        ? `<br><span>连跌区间：${downRun.start} → ${downRun.end}<br>连续收跌：${downRun.downDays} 个美股交易日；累计：${downRun.change.toFixed(2)}%</span>`
        : upRun
          ? `<br><span>连涨区间：${upRun.start} → ${upRun.end}<br>连续收涨：${upRun.upDays} 个美股交易日；累计：+${upRun.change.toFixed(2)}%</span>`
          : '';
      tooltip.innerHTML = `<strong>${selected.rawDate}</strong><br>^VIX：${selected.vix.toFixed(1)}<br>512480 前复权：${selected.etf.toFixed(1)}${runText}`;
      tooltip.hidden = false;
      tooltip.style.left = `${Math.min(width - tooltip.offsetWidth, Math.max(0, event.clientX - rect.left + 12))}px`;
      tooltip.style.top = `${Math.max(0, event.clientY - rect.top - tooltip.offsetHeight - 8)}px`;
    };
    const hide = () => { tooltip.hidden = true; hoverLine.hidden = true; vixDot.hidden = true; etfDot.hidden = true; };
    hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', hide);
  }
  const observer = new ResizeObserver(render); observer.observe(root); render();
})();
</script>
