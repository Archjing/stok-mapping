[project]
name = "stok-mapping"
version = "0.1.0"
description = "Phase 0 pipeline for cross-market mapping validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "akshare>=1.18.62",
  "beautifulsoup4>=4.14.3",
  "feedparser>=6.0.12",
  "mcp>=1.27.1",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pypdf>=6.12.2",
  "pyyaml>=6.0.2",
  "requests>=2.34.2",
  "rich>=13.9.0",
  "tushare>=1.4.29",
  "yfinance>=0.2.40",
]

[project.scripts]
stok-phase0 = "phase0.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]
