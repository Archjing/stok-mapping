<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A股指数走势 · 上证指数 / 深证成指 / 沪深300</title>
  </head>
  <body data-theme="dark">
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>A股指数走势</h1>
          <p>上证指数 · 深证成指 · 沪深300 · 创业板指 · 对照看板</p>
        </div>
        <div class="topbar-right">
          <div class="seg" id="view-switch" role="tablist"></div>
          <button id="theme-toggle" class="icon-btn" type="button" title="切换明暗主题">☀️</button>
        </div>
      </header>

      <section class="controls" id="controls-single">
        <div class="ctrl">
          <span class="lbl">指数</span>
          <div class="seg" id="index-switch" role="tablist"></div>
        </div>
        <div class="ctrl">
          <span class="lbl">均线</span>
          <div class="checks" id="ma-toggles"></div>
        </div>
        <div class="ctrl">
          <span class="lbl">区间</span>
          <div class="seg" id="range-buttons"></div>
        </div>
      </section>

      <section class="controls" id="controls-dash" hidden>
        <div class="ctrl ctrl-wide">
          <span class="lbl">标的</span>
          <div class="checks checks-wrap" id="dash-instruments"></div>
        </div>
        <div class="ctrl">
          <span class="lbl">对比</span>
          <div class="seg" id="dash-mode"></div>
          <div class="seg" id="dash-ma-span" hidden></div>
        </div>
        <div class="ctrl">
          <span class="lbl">区间</span>
          <div class="seg" id="dash-range"></div>
        </div>
      </section>

      <section class="readout" id="readout" aria-live="polite"></section>

      <main class="chart-wrap">
        <div id="chart" role="img" aria-label="指数蜡烛图"></div>
        <aside class="norm-panel" id="norm-panel" hidden>
          <div class="norm-title">归一化</div>
          <div class="norm-list" id="norm-list"></div>
        </aside>
        <div id="chart-loading" hidden>计算中…</div>
      </main>

      <footer id="status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
