<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A股指数走势 · 上证指数 / 深证成指 / 沪深300</title>
  </head>
  <body data-theme="dark">
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>A股指数走势</h1>
          <p>上证指数 · 深证成指 · 沪深300 日线蜡烛图（2005 至今）</p>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" title="切换明暗主题">☀️</button>
      </header>

      <section class="controls">
        <div class="ctrl">
          <span class="lbl">指数</span>
          <div class="seg" id="index-switch" role="tablist"></div>
        </div>
        <div class="ctrl">
          <span class="lbl">均线</span>
          <div class="checks" id="ma-toggles"></div>
        </div>
        <div class="ctrl">
          <span class="lbl">区间</span>
          <div class="seg" id="range-buttons"></div>
        </div>
      </section>

      <section class="readout" id="readout" aria-live="polite"></section>

      <main id="chart" role="img" aria-label="指数蜡烛图"></main>

      <footer id="status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
