      .done { fill: #e8f6ed; stroke: #2f8f4e; }
      .partial { fill: #fff3d4; stroke: #b87514; }
      .pending { fill: #f4f5f7; stroke: #8a94a6; stroke-dasharray: 8 6; }
      .neutral { fill: #eef5ff; stroke: #3b73c4; }
