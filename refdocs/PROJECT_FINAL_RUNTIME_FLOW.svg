  <!-- Main architecture lane -->
  <rect class="lane" x="48" y="366" width="1704" height="535"/>
  <text class="lane-title" x="72" y="402">二、主运行链路：数据源 → 本地数据底座 → 股票池/因子 → 策略治理 → 研究输出</text>
  <text class="lane-note" x="72" y="424">最终系统以本地 SQLite 和可审计报告为核心，跨市场信号只做风险/情绪 overlay，不替代 A 股本土主因子。</text>

