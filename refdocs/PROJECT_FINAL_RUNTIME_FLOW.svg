<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">stok-mapping 最终运行形态流程图</title>
  <desc id="desc">展示 stok-mapping 项目的最终软件架构、模块关系、用户交互方式、自动任务流程，并用状态样式区分已完成、最小接入或过渡、尚未启动。</desc>
