<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">stok-mapping 最终金融研究驾驶舱</title>
  <desc id="desc">FinFlow 风格的项目最终运行形态图，使用金融驾驶舱布局展示数据源、核心引擎、策略治理、自动任务和用户交付。</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#12343b"/>
      <stop offset="55%" stop-color="#1d5c63"/>
      <stop offset="100%" stop-color="#2f8f4e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#53606f"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b87514"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#102027" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f5f4ee; }
      .header { fill: url(#headerGrad); rx: 20; filter: url(#shadow); }
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 790; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; fill: #d9f2e4; letter-spacing: 0; }
      .panel { fill: #fffdf8; stroke: #d6d0c2; stroke-width: 1.3; rx: 16; filter: url(#shadow); }
      .panelDark { fill: #17353b; stroke: #26555d; stroke-width: 1.3; rx: 16; filter: url(#shadow); }
      .panelTitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 760; fill: #1f2937; letter-spacing: 0; }
      .panelTitleLight { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 760; fill: #ffffff; letter-spacing: 0; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #697386; letter-spacing: 0; }
      .labelLight { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #bed9d0; letter-spacing: 0; }
      .metric { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #1f2937; letter-spacing: 0; }
      .metricLight { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #ffffff; letter-spacing: 0; }
      .card { stroke-width: 1.7; rx: 10; filter: url(#shadow); }
      .done { fill: #e7f6ed; stroke: #2e8c55; }
      .partial { fill: #fff0ca; stroke: #b87514; }
      .pending { fill: #f2f4f7; stroke: #8a94a6; stroke-dasharray: 8 6; }
      .blue { fill: #eaf2ff; stroke: #3b73c4; }
      .cardTitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; font-weight: 730; fill: #202938; letter-spacing: 0; }
      .body { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 11.6px; fill: #4b5563; letter-spacing: 0; }
      .tag { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 10.5px; font-weight: 780; letter-spacing: 0; }
      .doneText { fill: #2e8c55; }
      .partialText { fill: #9a6a14; }
      .pendingText { fill: #7b8494; }
      .blueText { fill: #3b73c4; }
      .arrow { fill: none; stroke: #53606f; stroke-width: 2.2; marker-end: url(#arrow); }
      .softArrow { fill: none; stroke: #b87514; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowAmber); }
      .thin { stroke: #d7d0c0; stroke-width: 1.2; }
      .footer { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #6b7280; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1200"/>

  <rect class="header" x="48" y="32" width="1704" height="136"/>
  <text class="title" x="82" y="82">stok-mapping 最终金融研究驾驶舱</text>
  <text class="subtitle" x="82" y="112">把 A 股本土因子、跨市场 overlay、策略治理、盘前研判和模拟账户统一到一个可复盘的运行面板。</text>
  <text class="subtitle" x="82" y="138">定位：量化研究与风险提示工具；不生成交易指令，不让 LLM 进入主信号层。</text>

