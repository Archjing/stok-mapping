  <!-- Notes -->
  <rect class="node manual" x="88" y="1110" width="430" height="70"/>
  <text class="nodeTitle" x="108" y="1138">读图重点</text>
  <text class="body" x="108" y="1160">横向表示日常时间线，纵向表示同一阶段跨泳道交互；虚线箭头表示未来增强或人工摘要链路。</text>

  <rect class="node partial" x="550" y="1110" width="520" height="70"/>
  <text class="nodeTitle" x="570" y="1138">当前最关键的未闭环点</text>
  <text class="body" x="570" y="1160">Tiingo 主源、盘前日报自动归档/投递、真实账户 CSV 对账、Web/PWA/Tauri 复盘工作台。</text>

  <rect class="node done" x="1102" y="1110" width="520" height="70"/>
  <text class="nodeTitle" x="1122" y="1138">已形成的主链路</text>
  <text class="body" x="1122" y="1160">A 股数据底座 → 股票池 → 本土因子 → 策略验证 → gate → 账单/报告/盘前观察池。</text>

  <text class="footer" x="64" y="1224">版本：02-miro-workflow。边界：输出是研究研判与模拟验证，不是交易指令。</text>
