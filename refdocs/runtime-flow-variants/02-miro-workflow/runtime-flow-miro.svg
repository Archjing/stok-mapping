    <text class="body" x="16" y="47">SQLite + 来源审计</text>
    <text class="tag doneText" x="146" y="64">已完成</text>
  </g>

  <!-- Lane 4 nodes -->
  <g transform="translate(250 754)">
    <rect class="node done" width="190" height="70"/>
    <text class="nodeTitle" x="16" y="26">策略注册表</text>
    <text class="body" x="16" y="47">多候选策略工厂</text>
    <text class="tag doneText" x="126" y="64">已完成</text>
  </g>
  <g transform="translate(520 754)">
