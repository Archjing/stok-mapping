    <text class="body" x="16" y="47">当前 US 过渡，FRED 最小</text>
    <text class="tag partialText" x="138" y="64">扩展中</text>
  </g>
  <g transform="translate(1070 382)">
    <rect class="node partial" width="210" height="70"/>
    <text class="nodeTitle" x="16" y="26">premarket</text>
    <text class="body" x="16" y="47">盘前观察池 CLI</text>
    <text class="tag partialText" x="138" y="64">需投递</text>
  </g>
  <g transform="translate(1320 382)">
    <rect class="node done" width="210" height="70"/>
    <text class="nodeTitle" x="16" y="26">update-history</text>
    <text class="body" x="16" y="47">收盘后 A 股增量</text>
    <text class="tag doneText" x="146" y="64">已完成</text>
