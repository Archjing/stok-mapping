<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">stok-mapping 最终运行泳道流程图</title>
  <desc id="desc">Miro 白板风格的项目最终运行流程图，展示用户、调度、数据、策略、输出五条泳道之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9a6a14"/>
    </marker>
    <filter id="stickyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 780; fill: #1f2937; letter-spacing: 0; }
      .subtitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; fill: #5b6472; letter-spacing: 0; }
      .lane { fill: #fffdf9; stroke: #ddd5c4; stroke-width: 1.3; rx: 14; }
      .laneOdd { fill: #f7f5ee; stroke: #d6ccb8; stroke-width: 1.3; rx: 14; }
      .laneTitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 760; fill: #253044; letter-spacing: 0; }
      .laneDesc { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #6b7280; letter-spacing: 0; }
      .node { stroke-width: 1.8; rx: 7; filter: url(#stickyShadow); }
      .done { fill: #e5f6ea; stroke: #2e8c55; }
      .partial { fill: #fff0c8; stroke: #b87514; }
      .pending { fill: #f3f4f6; stroke: #8a94a6; stroke-dasharray: 8 6; }
      .manual { fill: #eaf2ff; stroke: #3b73c4; }
      .nodeTitle { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; font-weight: 740; fill: #1f2937; letter-spacing: 0; }
      .body { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 11.6px; fill: #4b5563; letter-spacing: 0; }
      .tag { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 10.5px; font-weight: 760; letter-spacing: 0; }
      .doneText { fill: #2e8c55; }
      .partialText { fill: #9a6a14; }
      .pendingText { fill: #7b8494; }
      .manualText { fill: #3b73c4; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2.1; marker-end: url(#arrow); }
      .softArrow { fill: none; stroke: #9a6a14; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
      .time { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; font-weight: 720; fill: #374151; letter-spacing: 0; }
      .footer { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #6b7280; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1250"/>
  <text class="title" x="64" y="58">stok-mapping 最终运行泳道流程图</text>
  <text class="subtitle" x="64" y="84">从“用户触发 + 自动调度”到“数据刷新 + 策略验证 + 盘前研判 + 复盘归档”的完整日常运行链路。</text>

  <g transform="translate(1186 30)">
    <rect class="node done" x="0" y="0" width="150" height="34"/>
    <text class="tag doneText" x="25" y="22">已完成 / 已验证</text>
    <rect class="node partial" x="170" y="0" width="160" height="34"/>
    <text class="tag partialText" x="196" y="22">过渡 / 扩展中</text>
    <rect class="node pending" x="350" y="0" width="160" height="34"/>
    <text class="tag pendingText" x="384" y="22">待开发</text>
  </g>

  <!-- Lanes -->
  <rect class="laneOdd" x="52" y="120" width="1696" height="170"/>
  <rect class="lane" x="52" y="306" width="1696" height="170"/>
  <rect class="laneOdd" x="52" y="492" width="1696" height="170"/>
  <rect class="lane" x="52" y="678" width="1696" height="170"/>
  <rect class="laneOdd" x="52" y="864" width="1696" height="220"/>

  <text class="laneTitle" x="78" y="154">用户与 Agent</text>
  <text class="laneDesc" x="78" y="176">人工查看、确认、复盘；Agent 只负责摘要、审查和消息通道。</text>
  <text class="laneTitle" x="78" y="340">调度与 CLI</text>
  <text class="laneDesc" x="78" y="362">手动命令和 cron 共同驱动日常任务。</text>
  <text class="laneTitle" x="78" y="526">数据刷新与本地库</text>
  <text class="laneDesc" x="78" y="548">数据先落库，经过覆盖率、新鲜度和来源审计，再进入研究链路。</text>
  <text class="laneTitle" x="78" y="712">策略验证与模拟账户</text>
  <text class="laneDesc" x="78" y="734">本土主因子生成候选，跨市场 overlay 做风险解释，gate 控制晋级。</text>
  <text class="laneTitle" x="78" y="898">输出、归档与复盘</text>
  <text class="laneDesc" x="78" y="920">所有结果落到报告、账单、日报和变更日志，形成可复盘记录。</text>

  <!-- Column guide times -->
  <text class="time" x="310" y="112">人工 / 任意时间</text>
  <text class="time" x="590" y="112">03:30 周任务</text>
  <text class="time" x="850" y="112">06:00 美股后</text>
  <text class="time" x="1100" y="112">07:30 盘前</text>
  <text class="time" x="1360" y="112">16:30 收盘后</text>
  <text class="time" x="1580" y="112">复盘 / 发布</text>

  <!-- Lane 1 nodes -->
  <g transform="translate(250 196)">
    <rect class="node manual" width="190" height="70"/>
    <text class="nodeTitle" x="16" y="26">用户查看与确认</text>
    <text class="body" x="16" y="47">观察池、风险、报告</text>
    <text class="tag manualText" x="128" y="64">入口</text>
  </g>
  <g transform="translate(1070 196)">
    <rect class="node partial" width="210" height="70"/>
