<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">stok-mapping logo</title>
  <desc id="desc">A fresh quantitative strategy logo with a matrix grid, whiteboard formulas, and a sharp red zig-zag signal.</desc>
  <defs>
    <linearGradient id="bg" x1="116" y1="96" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172a46"/>
      <stop offset="0.58" stop-color="#123a52"/>
      <stop offset="1" stop-color="#0f4a55"/>
    </linearGradient>
    <linearGradient id="signal" x1="214" y1="704" x2="808" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9625b"/>
      <stop offset="0.52" stop-color="#bd454d"/>
      <stop offset="1" stop-color="#d97b57"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#8d5b54" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="172" fill="url(#bg)"/>

  <g opacity="0.30" fill="none" stroke="#8ec8d4" stroke-width="4">
    <path d="M188 188H836M188 296H836M188 404H836M188 512H836M188 620H836M188 728H836M188 836H836"/>
    <path d="M188 188V836M296 188V836M404 188V836M512 188V836M620 188V836M728 188V836M836 188V836"/>
  </g>

  <g opacity="0.54" fill="#cbe9ef" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-weight="700">
    <text x="112" y="282" font-size="101" transform="rotate(-5 112 282)">MOM = R<tspan baseline-shift="sub" font-size="60">12-1</tspan></text>
    <text x="430" y="474" font-size="46" transform="rotate(7 430 474)">E[Rᵢ]=R<tspan baseline-shift="sub" font-size="28">f</tspan>+βᵢ(E[R<tspan baseline-shift="sub" font-size="28">m</tspan>]−R<tspan baseline-shift="sub" font-size="28">f</tspan>)</text>
    <text x="84" y="830" font-size="82" transform="rotate(3 84 830)">max μᵀw − λwᵀΣw</text>
  </g>

  <g filter="url(#softShadow)">
    <path d="M196 724L320 548L492 624L622 416L812 314"
          fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="butt" stroke-linejoin="bevel" opacity="0.96"/>
    <path d="M210 710L326 552L494 626L628 412L802 322"
          fill="none" stroke="url(#signal)" stroke-width="48" stroke-linecap="butt" stroke-linejoin="bevel"/>
  </g>

  <g fill="none" stroke="#f2e85c" stroke-linecap="butt" stroke-linejoin="miter">
    <circle cx="628" cy="412" r="108" stroke-width="13" stroke-dasharray="32 18"/>
    <path d="M598 442L662 378" stroke-width="12"/>
    <path d="M626 378H662V414" stroke-width="12"/>
  </g>
</svg>
