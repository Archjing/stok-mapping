    <path d="M213 680c76-98 145-128 206-90 38 24 70 54 113 16 43-39 55-126 117-158 44-23 95-2 148-70"
          fill="none" stroke="#ecfeff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <g fill="#e0f2fe" stroke="#0f172a" stroke-width="14">
    <circle cx="213" cy="680" r="42"/>
    <circle cx="419" cy="590" r="42"/>
    <circle cx="532" cy="606" r="42"/>
    <circle cx="649" cy="448" r="42"/>
    <circle cx="797" cy="378" r="42"/>
