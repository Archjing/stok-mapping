<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">stok-mapping logo</title>
  <desc id="desc">A market mapping logo with factor nodes, cross-market signal paths, and a selected trading signal.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#16324f"/>
      <stop offset="1" stop-color="#113c3a"/>
    </linearGradient>
    <linearGradient id="signal" x1="212" y1="642" x2="802" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="168" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#dbeafe" stroke-width="2">
