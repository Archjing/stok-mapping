  financial_factors:
    enabled: true
    table: "market_financial_factors"
    periods: 32
    markets: ["SH", "SZ"]
    min_factor_coverage: 0.60
    rebuild_universe_after: true
  cost_sensitivity:
    enabled: false
    scenarios:
      - name: "base_research_cost"
        slippage: 0.001
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "main_personal_execution"
        slippage: 0.00246
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "stress_slippage_0_003"
        slippage: 0.003
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "stress_slippage_0_005"
        slippage: 0.005
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "low_slippage"
        slippage: 0.0003
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "zero_cost"
        slippage: 0.0
        commission: 0.0
        stamp_duty_sell: 0.0
  manual_history_import:
    # Set A_SHARE_DATA_DIR to the external raw data directory in .env or shell.
    qfq_zip: "${A_SHARE_DATA_DIR}/daily_qfq.zip"
    bfq_zip: "${A_SHARE_DATA_DIR}/daily.zip"
    stock_list_csv: "${A_SHARE_DATA_DIR}/股票列表.csv"
    trading_calendar_csv: "${A_SHARE_DATA_DIR}/交易日历.csv"
    delisted_stock_csv: "${A_SHARE_DATA_DIR}/退市股票列表.csv"
    index_list_csv: "${A_SHARE_DATA_DIR}/指数/指数列表.csv"
    csi_index_list_csv: "${A_SHARE_DATA_DIR}/指数/中证指数列表.csv"
    index_daily_zip: "${A_SHARE_DATA_DIR}/指数/指数_日_kline.zip"
    csi_index_daily_zip: "${A_SHARE_DATA_DIR}/指数/中证指数_日_kline.zip"
    output_db: "data/manual_history/a_share_history.sqlite"
    years: 10
    chunk_size: 250000
  data_sources:
    fred:
      enabled: false
      api_key_env: "FRED_API_KEY"
      cache:
        enabled: true
        dir: "data/cache/fred"
        ttl_hours: 24
      series:
        gdp: "GDP"
        cpi: "CPIAUCSL"
        fedfunds: "FEDFUNDS"
        fedfunds_daily: "DFF"
        vix: "VIXCLS"
    tiingo:
      enabled: true
      token_env: "TIINGO_API_TOKEN"
      us_equities:
        - "NVDA"
        - "AAPL"
        - "TSLA"
      thematic_etfs:
        - "KWEB"
    yfinance:
      us_indices:
        - "^NDX"
        - "^SOX"
        - "^GSPC"
        - "^VIX"
      us_equities:
        - "NVDA"
        - "AAPL"
        - "TSLA"
      thematic_etfs:
        - "KWEB"
      cnh_proxy:
        - "CNY=X"
    tushare:
      enabled: true
      token_env: "TUSHARE_TOKEN"
      api_url: "http://api.tushare.pro"
      request_delay: 0.25
      max_retries: 3
      retry_backoff: 2
      min_coverage: 0.80
    akshare:
      anti_crawler:
        enabled: true
        request_delay: 0.8
        jitter: 0.4
        batch_size: 5
        batch_pause: 6
        max_retries: 1
        retry_backoff: 4
      cn_symbols:
        - "SZ.300750"
        - "SH.600519"
      hk_symbols:
        - "HK.00700"
        - "HK.09988"
  intelligence:
    ledger: "knowledge/intelligence/strategy_intelligence_ledger.csv"
    inbox_dir: "data/intelligence/inbox"
    report_dir: "archive/intelligence"
    sources:
      - name: "local_papers"
        type: "local_dir"
        enabled: true
        path: "refdocs/papers"
      - name: "logseq_pages"
        type: "local_dir"
        enabled: false
        path: "/home/zj/workspace/KMS/My_logseq/pages"
      - name: "arxiv_quant_finance"
        type: "arxiv"
        enabled: true
        query: "all:quantitative finance stock trading strategy"
      - name: "openalex_quant_strategy"
        type: "openalex"
        enabled: true
        query: "quantitative investment stock strategy"
      - name: "crossref_quant_strategy"
        type: "crossref"
        enabled: true
        query: "quantitative investment stock strategy"
      - name: "rss_quantocracy"
        type: "rss"
        enabled: true
        url: "https://feeds.feedburner.com/Quantocracy"
  maintenance_orchestrator:
    enabled: true
    state_db: "data/maintenance/maintenance.sqlite"
    default_timezone: "Asia/Shanghai"
    tushare_financial_backfill:
      shard_count: 3
      max_requests_per_minute_per_shard: 67
      default_start_period: "2018-06-30"
      default_end_period: "2026-03-31"
  walk_forward:
    preset_name: "baseline_2y_1y_5fold"
    presets:
      baseline_2y_1y:
        train_years: 2
        validate_years: 1
        description: "统一候选比较 baseline，保留与既有报告可比性。"
      baseline_2y_1y_5fold:
        train_years: 2
        validate_years: 1
        start_date: "2019-04-01"
        end_date: "2026-03-31"
        expected_folds: 5
        description: "通用策略准入 baseline；自然日期窗口，交易日历过滤，5 折验收。"
      quality_3y_1y:
        train_years: 3
        validate_years: 1
        description: "低频质量/低换手策略稳健性复核窗口。"
      quality_3y_1y_4fold:
        train_years: 3
        validate_years: 1
        start_date: "2019-04-01"
        end_date: "2026-03-31"
        expected_folds: 4
        description: "低频质量/低换手策略稳健性复核；自然日期窗口，交易日历过滤。"
      quality_4y_1y:
        train_years: 4
        validate_years: 1
        start_date: "2020-04-01"
        end_date: "2026-03-31"
        expected_folds: 2
        description: "质量/低换手策略严格复核窗口；自然日期窗口，交易日历过滤。"
    min_samples: 200
    execution:
      # Profiling is opt-in. Use `strategy-admission --profile` when diagnosing runtime.
      profile: false
      profile_output_dir: "logs/perf"
    cache:
      # Runtime cache only shares safe boundaries: raw/fold inputs and per-strategy prepared panels.
      # Prepared panels are never shared across different strategy IDs/configs/folds.
      enabled: true
      refresh: false
      prepared_panel:
        enabled: true
        disk_enabled: false
        dir: "data/cache/walk_forward/prepared"
      fold_panel:
        enabled: true
        disk_enabled: false
        dir: "data/cache/walk_forward/folds"
    initial_cash: 1000000
    commission: 0.00025
    stamp_duty_sell: 0.0005
    slippage: 0.00246
    gate:
      annualized_return_min: 0.0
      sharpe_min: 0.5
      max_drawdown_min: -0.25
      win_rate_min: 0.45
      oos_return_decay_ratio_max: 0.30
      oos_annualized_return_min: 0.0
      oos_sharpe_min: 0.5
      min_oos_fold_count: 2
      min_positive_fold_ratio: 0.75
      max_negative_fold_count: 1
      min_fold_annualized_return_min: -0.10
      min_oos_positive_fold_ratio: 1.0
    admission:
      # strategy_sets 是准入设计输入，不记录运行状态。
      # 一次性缩小范围优先用 CLI --strategies；下次不带该参数会回到默认集合。
      # 注释某个策略行属于持久配置变更，需要手动取消注释恢复。
      default_strategy_set: "baseline_admission_all_v1"
      strategy_sets:
        baseline_admission_all_v1:
          description: "默认全局准入策略集合；临时缩小范围优先使用 CLI --strategies 覆盖。"
          strategies:
            - "legacy_momentum"
            - "legacy_momentum_low_turnover_v1"
            - "ma_kline_baseline_v1"
            - "residual_momentum_reversal_v1"
            - "residual_momentum_reversal_v2"
            - "quality_growth_price_v1"
            - "low_vol_low_turnover_quality_v1"
            - "quality_low_turnover_monthly_v1"
            - "multifactor_volume_price_filter_v1"
            - "core_selection_quality_momentum_v1"
            - "theme_exposure_momentum_v1"
            - "sleeve_composite_v1"
            - "sleeve_composite_low_churn_v1"
        quality_research_v1:
          description: "质量/低换手策略专项研究集合。"
          strategies:
            - "quality_growth_price_v1"
            - "low_vol_low_turnover_quality_v1"
            - "quality_low_turnover_monthly_v1"
        sleeve_research_v1:
          description: "T2.10 规则型 sleeve 组合研究集合；不代表准入或交易信号。"
          strategies:
            - "legacy_momentum_low_turnover_v1"
            - "quality_low_turnover_monthly_v1"
            - "sleeve_composite_v1"
      gate:
        annualized_return_min: 0.0
        sharpe_min: 0.5
        max_drawdown_min: -0.25
        positive_fold_ratio_min: 0.75
        turnover_annual_mean_max: 3.0
        turnover_annual_max_max: 5.0
        overfit_risk_max: "medium"
        require_parameter_stability: true
        require_industry_concentration_check: true
        require_factor_diagnostics: true
        require_qfq_asof: true
      diagnostics:
        suites:
          - "data_quality_v1"
          - "execution_feasibility_v1"
          - "factor_explainability_v1"
          - "overfit_v1"
    strategy_v2:
      mode: "compare"
      # 非 admission walk-forward 的兼容候选列表。
      compare_strategies:
        - "legacy_momentum"
        - "legacy_momentum_low_turnover_v1"
        - "ma_kline_baseline_v1"
        - "residual_momentum_reversal_v1"
        - "residual_momentum_reversal_v2"
        - "quality_growth_price_v1"
        - "low_vol_low_turnover_quality_v1"
        - "quality_low_turnover_monthly_v1"
        - "multifactor_volume_price_filter_v1"
        - "core_selection_quality_momentum_v1"
        - "theme_exposure_momentum_v1"
        - "sleeve_composite_v1"
        - "sleeve_composite_low_churn_v1"
      candidate_governance:
        enabled: true
        selection_panel_scope: "portfolio"
        min_fold_count: 20
        min_symbol_count: 20
        min_portfolio_fold_count: 4
      constraints:
        enabled: true
        apply_to: []
        industry:
          enabled: true
          mode: "audit"
          max_names_per_industry: 2
          max_industry_weight: 0.35
          unknown_industry_policy: "allow"
      account_execution:
        enabled: true
        initial_cash: 1000000
        execution_price_mode: "next_open"
        price_tick: 0.01
        lot_size: 100
        max_participation_rate: 0.05
        min_commission: 5.0
        transfer_fee_rate: 0.00001
        min_trade_amount: 1000.0
        enable_t_plus_one: true
        enable_limit_check: true
        enable_suspension_check: true
        enable_special_limit_rules: true
        st_limit_pct: 0.05
        new_stock_no_limit_days: 5
      top_n: 3
      mom_windows: [3, 5, 10, 20]
      mom_quantiles: [0.5, 0.6]
      trend_windows: [20, 60]
      vol_window: 20
      vol_quantiles: [0.6, 0.75]
      target_vol: 0.18
      train_min_trades: 5
      legacy_momentum_low_turnover:
        enabled: true
        mom_windows: [5, 20]
        buy_quantiles: [0.6]
        hold_quantiles: [0.4]
        buy_top_n_values: [5, 10]
        hold_rank_multipliers: [2.0]
        rebalance_days_values: [5, 10, 20]
        min_hold_days_values: [5, 10]
        turnover_penalties: [0.01, 0.02]
      sleeve_composite:
        enabled: true
        defensive_quality_weight: 0.55
        low_turnover_momentum_weight: 0.25
        risk_overlay_weight: 0.20
        momentum_windows: [20, 60]
        top_n: 10
        max_symbol_weight: 0.10
      sleeve_composite_low_churn:
        enabled: true
        top_n: 10
        hold_rank_multiplier: 2.0
        rebalance_days: 20
        min_hold_days: 20
        max_symbol_weight: 0.10
        max_names_per_industry: 2
      cross_market:
        enabled: true
        tech_score_thresholds: [0.0, 0.5]
        vix_risk_off_level: 25
        cny_pressure_threshold: 0.003
        magnitude_z_window: 252
        magnitude_z_min_periods: 60
        magnitude_z_clip: 2.0
        magnitude_score_thresholds: [0.0]
        soft_risk_scale: 0.5
        mapped_symbols:
          SZ.300750: ev
          SZ.002594: ev
          SH.688981: semiconductor
          SZ.002475: consumer_electronics
          SZ.300308: ai_infra
          SZ.300502: ai_infra
          SZ.300394: ai_infra
          SZ.002415: tech_hardware
          SZ.000063: tech_hardware
          SH.688012: semiconductor
          SZ.002371: consumer_electronics
          SH.603986: semiconductor
          SZ.002241: semiconductor
          SZ.000725: semiconductor
          SZ.000333: domestic_core
          SZ.000651: domestic_core
          SZ.000858: domestic_core
          SH.600519: domestic_core
          SH.601318: financial
          SH.600036: financial
          SH.600276: healthcare
          SH.600900: defensive
          SH.600030: financial
      price_volume_features:
        amount_ma_window: 20
        breakout_window: 20
        shadow_clip: 5.0
      baseline_ma_kline:
        enabled: true
        top_n_values: [3, 5]
        trend_window_pairs: [[20, 60]]
        amount_ratio_mins: [1.0, 1.2]
        upper_shadow_max_values: [1.0, 1.5]
      core_selection_quality_momentum:
        enabled: false
        quality_quantiles: [0.6, 0.7]
        residual_windows: [10, 20]
        residual_quantiles: [0.55, 0.6]
        top_n_values: [8, 12]
        use_xmarket_overlay: false
      theme_exposure_momentum:
        enabled: false
        mom_windows: [10, 20]
        mom_quantiles: [0.6, 0.7]
        top_n_values: [3, 5]
        amount_ratio_mins: [1.0, 1.2]
        breakout_required_values: [true]
        xmarket_thresholds: [0.0, 0.5]
        use_xmarket_overlay: true
      local_factor:
        enabled: true
        residual_momentum_windows: [10, 20]
        residual_momentum_quantiles: [0.6]
        reversal_window: 3
        reversal_quantiles: [0.7]
        use_xmarket_overlay: true
        residual_reversal_v2:
          enabled: true
          residual_windows: [5, 10, 20]
          residual_quantiles: [0.6]
          reversal_windows: [1, 3]
          reversal_quantiles: [0.7]
          amount_ratio_mins: [1.0, 1.2]
          upper_shadow_max_values: [1.0, 1.5]
          gap_ret_max_values: [0.03, 0.05]
          use_xmarket_overlay: false
        multifactor_filter:
          enabled: true
          quality_quantiles: [0.7]
          residual_windows: [10, 20]
          residual_quantiles: [0.6]
          top_n_values: [5, 10]
          amount_ratio_mins: [1.0, 1.2]
          upper_shadow_max_values: [1.0, 1.5]
          breakout_required_values: [false, true]
          use_xmarket_overlay: false
          factor_weights:
            quality_growth: 0.45
            residual_momentum: 0.35
            low_volatility: 0.20
        quality_growth:
          enabled: true
          financial_table: "market_financial_factors"
          financial_lag_days: 1
          min_available_fields: 4
          quality_quantiles: [0.7]
          top_n_values: [5, 10]
          cash_flow_quality_clip: [-5, 5]
          growth_clip: [-100, 300]
          debt_to_asset_clip: [0, 100]
          use_xmarket_overlay: true
          weights:
            roe: 0.30
            cash_flow_quality: 0.20
            profit_growth: 0.20
            revenue_growth: 0.15
            low_debt: 0.15
        low_vol_low_turnover_quality:
          enabled: true
          quality_quantiles: [0.6, 0.7]
          low_vol_windows: [20, 60]
          low_vol_quantiles: [0.5]
          low_turnover_quantiles: [0.5]
          momentum_windows: [20, 60]
          top_n_values: [10, 20]
          hold_rank_multipliers: [2.0]
          rebalance_days_values: [20, 40]
          min_hold_days_values: [20]
          turnover_penalties: [0.02]
          max_symbol_weight: 0.10
          use_xmarket_overlay: false
          factor_weights:
            low_volatility: 0.40
            low_turnover: 0.25
            quality: 0.25
            medium_momentum: 0.10
        quality_low_turnover_monthly:
          enabled: true
          quality_quantiles: [0.6, 0.7]
          low_vol_windows: [20, 60]
          low_vol_quantiles: [0.5, 0.6]
          low_turnover_quantiles: [0.5]
          top_n_values: [10, 20]
          hold_rank_multipliers: [2.0]
