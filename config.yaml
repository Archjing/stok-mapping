phase0:
  benchmark_symbol: "SH.000300"
  years: 7
  symbols:
    - "SZ.300750"
    - "SZ.002594"
    - "SH.688981"
    - "SZ.002475"
    - "SZ.300308"
    - "SZ.300502"
    - "SZ.300394"
    - "SZ.002415"
    - "SZ.000063"
    - "SH.688012"
    - "SZ.002371"
    - "SH.603986"
    - "SZ.002241"
    - "SZ.000725"
    - "SZ.000333"
    - "SZ.000651"
    - "SZ.000858"
    - "SH.600519"
    - "SH.601318"
    - "SH.600036"
    - "SH.600276"
    - "SH.600900"
    - "SH.600030"
  universe:
    enabled: true
    target_size: 500
    min_usable_size: 100
    walk_forward_limit: 120
    output_dir: "data/universe"
    output_file: "local_factor_universe.csv"
    snapshot_file: "a_share_snapshot.csv"
    report_file: "local_factor_universe_report.md"
    markets: ["SH", "SZ"]
    exclude_name_patterns: ["ST", "*ST", "退"]
    min_amount: 50000000
    min_total_mv: 5000000000
    max_industry_weight: 0.12
    fallback_days: 90
    fetch_industry: true
    industry_max_boards: 120
  local_history:
    enabled: true
    path: "data/manual_history/a_share_history.sqlite"
    market: "CN"
    adjust_type: "qfq"
    daily_table: "market_daily_bars"
    meta_table: "market_stocks"
    financial_table: "market_financial_factors"
    index_table: "market_index_bars"
    index_meta_table: "market_indices"
    calendar_table: "trading_calendar"
    use_for_daily_fallback: true
    use_for_universe_fallback: true
    prefer_daily_for_backtest: true
    min_history_days: 200
    max_snapshot_staleness_days: 1
    min_snapshot_coverage: 0.80
    allow_stale_universe_fallback: false
  manual_history_update:
    enabled: true
    adjust_types: ["qfq"]
    markets: ["SH", "SZ"]
    max_staleness_days: 1
    min_latest_coverage: 0.80
    refresh_metadata: true
    min_metadata_coverage: 0.80
    min_run_time: "16:30"
    source_audit_table: "market_data_source_runs"
    rebuild_universe_after: true
    run_before_phase0: true
    max_symbols: 0
  us_market_history:
    enabled: true
    path: "data/us_market_history.sqlite"
    daily_table: "us_daily_bars"
    source_audit_table: "us_data_source_runs"
    provider: "yfinance"
    years: 5
    max_staleness_days: 3
    min_symbol_coverage: 1.0
    run_before_phase0: true
    runtime_yfinance_fallback: false
    symbols: ["^NDX", "^SOX", "NVDA", "KWEB", "^VIX", "CNY=X"]
  hk_market_history:
    enabled: false
    path: "data/hk_market_history.sqlite"
    daily_table: "hk_daily_bars"
    source_audit_table: "hk_data_source_runs"
    provider: "akshare_hk"
    years: 5
    max_staleness_days: 3
    min_symbol_coverage: 1.0
    run_before_phase0: false
    symbols: ["HK.00700", "HK.09988"]
  financial_factors:
    enabled: true
    table: "market_financial_factors"
    periods: 32
    markets: ["SH", "SZ"]
    min_factor_coverage: 0.60
    rebuild_universe_after: true
  cost_sensitivity:
    enabled: true
    scenarios:
      - name: "current_cost"
        slippage: 0.001
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "low_slippage"
        slippage: 0.0003
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "zero_cost"
        slippage: 0.0
        commission: 0.0
        stamp_duty_sell: 0.0
  manual_history_import:
    qfq_zip: "/home/zj/workspace/tmp/A股数据_zip/daily_qfq.zip"
    bfq_zip: "/home/zj/workspace/tmp/A股数据_zip/daily.zip"
    stock_list_csv: "/home/zj/workspace/tmp/A股数据_zip/股票列表.csv"
    trading_calendar_csv: "/home/zj/workspace/tmp/A股数据_zip/交易日历.csv"
    delisted_stock_csv: "/home/zj/workspace/tmp/A股数据_zip/退市股票列表.csv"
    index_list_csv: "/home/zj/workspace/tmp/A股数据_zip/指数/指数列表.csv"
    csi_index_list_csv: "/home/zj/workspace/tmp/A股数据_zip/指数/中证指数列表.csv"
    index_daily_zip: "/home/zj/workspace/tmp/A股数据_zip/指数/指数_日_kline.zip"
    csi_index_daily_zip: "/home/zj/workspace/tmp/A股数据_zip/指数/中证指数_日_kline.zip"
    output_db: "data/manual_history/a_share_history.sqlite"
    years: 10
    chunk_size: 250000
  data_sources:
    yfinance:
      us_indices:
        - "^NDX"
        - "^SOX"
        - "^GSPC"
        - "^VIX"
      us_equities:
        - "NVDA"
        - "AAPL"
        - "TSLA"
      thematic_etfs:
        - "KWEB"
      cnh_proxy:
        - "CNY=X"
    tushare:
      enabled: true
      token_env: "TUSHARE_TOKEN"
      api_url: "http://api.tushare.pro"
      request_delay: 0.25
      max_retries: 3
      retry_backoff: 2
      min_coverage: 0.80
    akshare:
      anti_crawler:
        enabled: true
        request_delay: 0.8
        jitter: 0.4
        batch_size: 5
        batch_pause: 6
        max_retries: 1
        retry_backoff: 4
      cn_symbols:
        - "SZ.300750"
        - "SH.600519"
      hk_symbols:
        - "HK.00700"
        - "HK.09988"
  walk_forward:
    train_years: 2
    validate_years: 1
    min_samples: 200
    initial_cash: 1000000
    commission: 0.00025
    stamp_duty_sell: 0.0005
    slippage: 0.001
    strategy_v2:
      mode: "compare"
      compare_strategies: ["legacy_momentum", "ma_kline_baseline_v1", "residual_momentum_reversal_v1", "residual_momentum_reversal_v2", "quality_growth_price_v1", "multifactor_volume_price_filter_v1"]
      candidate_governance:
        enabled: true
        selection_panel_scope: "portfolio"
        min_fold_count: 20
        min_symbol_count: 20
        min_portfolio_fold_count: 4
      top_n: 3
      mom_windows: [3, 5, 10, 20]
      mom_quantiles: [0.5, 0.6]
      trend_windows: [20, 60]
      vol_window: 20
      vol_quantiles: [0.6, 0.75]
      target_vol: 0.18
      train_min_trades: 5
      cross_market:
        enabled: true
        tech_score_thresholds: [0.0, 0.5]
        vix_risk_off_level: 25
        cny_pressure_threshold: 0.003
        magnitude_z_window: 252
        magnitude_z_min_periods: 60
        magnitude_z_clip: 2.0
        magnitude_score_thresholds: [0.0]
        soft_risk_scale: 0.5
        mapped_symbols:
          SZ.300750: ev
          SZ.002594: ev
          SH.688981: semiconductor
          SZ.002475: consumer_electronics
          SZ.300308: ai_infra
          SZ.300502: ai_infra
          SZ.300394: ai_infra
          SZ.002415: tech_hardware
          SZ.000063: tech_hardware
          SH.688012: semiconductor
          SZ.002371: consumer_electronics
          SH.603986: semiconductor
          SZ.002241: semiconductor
          SZ.000725: semiconductor
          SZ.000333: domestic_core
          SZ.000651: domestic_core
          SZ.000858: domestic_core
          SH.600519: domestic_core
          SH.601318: financial
          SH.600036: financial
          SH.600276: healthcare
          SH.600900: defensive
          SH.600030: financial
      price_volume_features:
        amount_ma_window: 20
        breakout_window: 20
        shadow_clip: 5.0
      baseline_ma_kline:
        enabled: true
        top_n_values: [3, 5]
        trend_window_pairs: [[20, 60]]
        amount_ratio_mins: [1.0, 1.2]
        upper_shadow_max_values: [1.0, 1.5]
      local_factor:
        enabled: true
        residual_momentum_windows: [10, 20]
        residual_momentum_quantiles: [0.6]
        reversal_window: 3
        reversal_quantiles: [0.7]
        use_xmarket_overlay: true
        residual_reversal_v2:
          enabled: true
          residual_windows: [5, 10, 20]
          residual_quantiles: [0.6]
          reversal_windows: [1, 3]
          reversal_quantiles: [0.7]
          amount_ratio_mins: [1.0, 1.2]
          upper_shadow_max_values: [1.0, 1.5]
          gap_ret_max_values: [0.03, 0.05]
          use_xmarket_overlay: false
        multifactor_filter:
          enabled: true
          quality_quantiles: [0.7]
          residual_windows: [10, 20]
          residual_quantiles: [0.6]
          top_n_values: [5, 10]
          amount_ratio_mins: [1.0, 1.2]
          upper_shadow_max_values: [1.0, 1.5]
          breakout_required_values: [false, true]
          use_xmarket_overlay: false
          factor_weights:
            quality_growth: 0.45
            residual_momentum: 0.35
            low_volatility: 0.20
        quality_growth:
          enabled: true
          financial_table: "market_financial_factors"
          financial_lag_days: 1
          min_available_fields: 4
          quality_quantiles: [0.7]
          top_n_values: [5, 10]
          cash_flow_quality_clip: [-5, 5]
          growth_clip: [-100, 300]
          debt_to_asset_clip: [0, 100]
          use_xmarket_overlay: true
          weights:
            roe: 0.30
            cash_flow_quality: 0.20
            profit_growth: 0.20
            revenue_growth: 0.15
            low_debt: 0.15
