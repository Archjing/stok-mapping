quant:
  ai_corpus:
    database_path: "data/ai_corpus/ai_corpus.sqlite"
    us_market_news:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/us_market_news"
      keywords:
        - "semiconductor"
        - "semiconductors"
        - "chip"
        - "chips"
        - "SOX"
        - "VIX"
        - "Nasdaq"
        - "Federal Reserve"
        - "interest rate"
        - "NVIDIA"
        - "NVDA"
        - "AMD"
        - "Intel"
        - "TSMC"
        - "Taiwan Semiconductor"
      feeds:
        - name: "cnbc_markets"
          source: "CNBC Markets"
          url: "https://www.cnbc.com/id/10000664/device/rss/rss.html"
          topics: ["us_market"]
          language: "en-US"
        - name: "cnbc_technology"
          source: "CNBC Technology"
          url: "https://www.cnbc.com/id/19854910/device/rss/rss.html"
          topics: ["technology", "semiconductor"]
          language: "en-US"
    sia_sales:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/sia_sales"
    semi_supply_chain:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/semi_supply_chain"
      # 转载页 URL 由每月定时检索填入 (官方源 Cloudflare/DNS 不可达)
      source_urls: []
    cls_telegraph:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/cn_finance_flash"
    sina_7x24:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/cn_finance_flash"
    wallstcn_lives:
      enabled: true
      raw_archive_dir: "data/raw_data/ai_corpus/cn_finance_flash"
  benchmark_symbol: "SH.000300"
  years: 7
  symbols:
    - "SZ.300750"
    - "SZ.002594"
    - "SH.688981"
    - "SZ.002475"
    - "SZ.300308"
    - "SZ.300502"
    - "SZ.300394"
    - "SZ.002415"
    - "SZ.000063"
    - "SH.688012"
    - "SZ.002371"
    - "SH.603986"
    - "SZ.002241"
    - "SZ.000725"
    - "SZ.000333"
    - "SZ.000651"
    - "SZ.000858"
    - "SH.600519"
    - "SH.601318"
    - "SH.600036"
    - "SH.600276"
    - "SH.600900"
    - "SH.600030"
  universe:
    enabled: true
    point_in_time_for_backtest: true
    allow_static_universe_for_backtest: false
    target_size: 500
    min_usable_size: 100
    walk_forward_limit: 120
    output_dir: "data/universe"
    output_file: "local_factor_universe.csv"
    snapshot_file: "a_share_snapshot.csv"
    report_file: "local_factor_universe_report.md"
    markets: ["SH", "SZ"]
    exclude_name_patterns: ["ST", "*ST", "退"]
    min_amount: 50000000
    min_total_mv: 5000000000
    max_industry_weight: 0.12
    fallback_days: 90
    fetch_industry: true
    industry_max_boards: 120
  local_history:
    enabled: true
    path: "data/a_share_history.sqlite"
    market: "CN"
    adjust_type: "qfq"
    execution_adjust_type: "bfq"
    daily_table: "market_daily_bars"
    meta_table: "market_stocks"
    daily_basic_table: "market_daily_basic"
    financial_table: "market_financial_factors"
    adj_factor_table: "market_adj_factors"
    dividend_table: "market_dividends"
    index_table: "market_index_bars"
    index_meta_table: "market_indices"
    calendar_table: "trading_calendar"
    price_adjustment_for_backtest: "qfq_asof"
    price_adjustment_audit:
      enabled: true
      compare_modes: ["qfq_current", "qfq_asof", "bfq_raw"]
      feature_checks: ["mom20", "ma20", "vol20", "breakout20"]
    use_for_daily_fallback: true
    use_for_universe_fallback: true
    prefer_daily_for_backtest: true
    min_history_days: 200
    max_snapshot_staleness_days: 1
    min_snapshot_coverage: 0.80
    allow_stale_universe_fallback: false
  etf_history:
    enabled: true
    path: "data/etf_history.sqlite"
    catalog_max_age_days: 7
    chunk_years: 1
    max_symbols_per_run: 50
    max_tasks_per_run: 1000
    max_requests_per_minute: 100
    max_retries: 3
    retry_backoff_seconds: 2.0
    stale_running_minutes: 30
    report_dir: "reports/database_health/etf_history"
    universes:
      sector_core_v1:
        sectors:
          broad_market:
            - symbol: "SH.510300"
            - symbol: "SZ.159915"
          semiconductor:
            - symbol: "SH.512480"
      single_etf:
        manifest_source: "manual_config"
        sectors:
          semiconductor:
            - symbol: "SH.512480"
              ts_code: "512480.SH"
              listed_from: "2019-06-12"
      semiconductor_timing_etfs:
        # 受控的回填范围；声明在此不代表全部标的已完成分钟数据审计或可启用账户。
        manifest_source: "manual_config"
        sectors:
          semiconductor:
            - symbol: "SH.512480"
              ts_code: "512480.SH"
              listed_from: "2019-06-12"
            - symbol: "SH.512760"
              ts_code: "512760.SH"
              listed_from: "2019-06-12"
            - symbol: "SH.516920"
              ts_code: "516920.SH"
              listed_from: "2021-08-16"
            - symbol: "SH.516640"
              ts_code: "516640.SH"
              listed_from: "2021-08-27"
            - symbol: "SZ.159995"
              ts_code: "159995.SZ"
              listed_from: "2020-02-10"
            - symbol: "SZ.159813"
              ts_code: "159813.SZ"
              listed_from: "2020-05-25"
            - symbol: "SZ.159801"
              ts_code: "159801.SZ"
              listed_from: "2020-02-18"
            - symbol: "SH.588200"
              ts_code: "588200.SH"
              listed_from: "2022-10-26"
  china_options:
    enabled: true
    path: "data/china_options.sqlite"
    provider: "akshare_sina"
    underlying: "HO"
    index_id: "CN_PANIC_HO30"
    max_terms: 4
    target_days: 30
    # Local CN calendar handles holiday roll-forward; overrides are audited exceptions.
    expiry_overrides: {}
  reporting:
    root_dir: "reports"
    categories:
      archive: "archive"
      database_health: "database_health"
      phase0: "phase0"
      runs: "runs"
      strategy_admission: "strategy_admission"
      strategy_governance: "strategy_governance"
  manual_history_update:
    enabled: true
    adjust_types: ["qfq", "bfq"]
    markets: ["SH", "SZ"]
    max_staleness_days: 1
    min_latest_coverage: 0.80
    refresh_metadata: true
    min_metadata_coverage: 0.80
    min_run_time: "16:30"
    source_audit_table: "market_data_source_runs"
    rebuild_universe_after: true
    run_before_phase0: true
    max_symbols: 0
  us_market_history:
    enabled: true
    path: "data/us_market_history.sqlite"
    daily_table: "us_daily_bars"
    source_audit_table: "us_data_source_runs"
    provider: "yfinance"
    years: 5
    max_staleness_days: 3
    min_symbol_coverage: 1.0
    run_before_phase0: true
    runtime_yfinance_fallback: false
    instrument_groups:
      core_signal:
        symbols: ["^SOX", "^VIX"]
        purpose: "半导体ETF美股情绪映射择时的现有执行信号"
        required_for: ["cross_market_semiconductor_timing_etf_v1"]
        critical: true
      semiconductor_breadth:
        symbols: ["AMD", "TSM", "ASML", "AMAT", "LRCX", "INTC", "SMH"]
        purpose: "拆解SOX的半导体产业链广度与共振"
      mega_tech_beta:
        symbols: ["AAPL", "MSFT", "GOOGL", "AMZN", "META"]
        purpose: "区分半导体需求与大型科技股贝塔"
      rates:
        symbols: ["^TNX"]
        purpose: "观察10年期美债收益率对科技估值的压力"
      china_tech_sentiment:
        symbols: ["BABA", "JD", "KWEB"]
        purpose: "观察中概及中国科技风险偏好"
      reference_and_fx:
        symbols: ["^NDX", "NVDA", "CNY=X"]
        purpose: "纳指、英伟达和人民币汇率的参考背景"
  cross_market_reference_history:
    enabled: true
    path: "data/cross_market_reference_history.sqlite"
    daily_table: "cross_market_reference_daily"
    source_audit_table: "cross_market_reference_source_runs"
    years: 7
    max_staleness_days: 3
    min_symbol_coverage: 1.0
    run_before_phase0: true
    series:
      "^NDX":
        provider: "fred"
        source_series_id: "NASDAQ100"
      "^SOX":
        provider: "fred"
        source_series_id: "NASDAQSOX"
  hk_market_history:
    enabled: true
    path: "data/hk_market_history.sqlite"
    daily_table: "hk_daily_bars"
    source_audit_table: "hk_data_source_runs"
    provider: "yfinance"
    years: 5
    max_staleness_days: 3
    min_symbol_coverage: 1.0
    run_before_phase0: true
    symbols:
      - "HK.00700"  # 腾讯控股
      - "HK.09988"  # 阿里巴巴-W
      - "HK.03690"  # 美团-W
      - "HK.01810"  # 小米集团-W
      - "HK.00981"  # 中芯国际
      - "HK.01211"  # 比亚迪股份
      - "HK.09618"  # 京东集团-SW
      - "HK.09888"  # 百度集团-SW
      - "HK.01024"  # 快手-W
      - "HK.09999"  # 网易-S
      - "HK.02015"  # 理想汽车-W
      - "HK.09868"  # 小鹏汽车-W
      - "HK.01347"  # 华虹半导体
      - "HK.00992"  # 联想集团
      - "HK.00005"  # 汇丰控股
      - "HK.00388"  # 香港交易所
      - "HK.01299"  # 友邦保险
      - "HK.02318"  # 中国平安
      - "HK.00939"  # 建设银行
      - "HK.01398"  # 工商银行
      - "HK.03988"  # 中国银行
      - "HK.00941"  # 中国移动
      - "HK.00728"  # 中国电信
      - "HK.00883"  # 中国海洋石油
      - "HK.01088"  # 中国神华
      - "HK.02899"  # 紫金矿业
      - "HK.02020"  # 安踏体育
      - "HK.09633"  # 农夫山泉
      - "HK.02269"  # 药明生物
      - "HK.06160"  # 百济神州
  europe_market_history:
    enabled: true
    path: "data/euro_market_history.sqlite"
    daily_table: "market_daily_bars"
    source_audit_table: "market_data_source_runs"
    provider: "eodhd"
    # Keep the token only in .env, never in config.yaml or Git.
    api_token_env: "EODHD_API_TOKEN"
    years: 5
    # European exchange holidays can create four consecutive non-trading days.
    max_staleness_days: 5
    min_symbol_coverage: 1.0
    run_before_phase0: false
    # Canonical research identifiers remain stable even if a provider changes.
    # These are price-index series, not total-return indices.
    symbols: ["^FTSE", "^GDAXI", "^FCHI", "^STOXX50E", "^STOXX"]
    source_symbols:
      "^FTSE": "FTSE.INDX"
      "^GDAXI": "GDAXI.INDX"
      "^FCHI": "FCHI.INDX"
      "^STOXX50E": "STOXX50E.INDX"
      "^STOXX": "STOXX.INDX"
  financial_factors:
    enabled: true
    table: "market_financial_factors"
    periods: 32
    markets: ["SH", "SZ"]
    min_factor_coverage: 0.60
    rebuild_universe_after: true
  cost_sensitivity:
    enabled: false
    scenarios:
      - name: "base_research_cost"
        slippage: 0.001
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "main_personal_execution"
        slippage: 0.00246
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "stress_slippage_0_003"
        slippage: 0.003
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "stress_slippage_0_005"
        slippage: 0.005
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "low_slippage"
        slippage: 0.0003
        commission: 0.00025
        stamp_duty_sell: 0.0005
      - name: "zero_cost"
        slippage: 0.0
        commission: 0.0
        stamp_duty_sell: 0.0
  manual_history_import:
    # Set A_SHARE_DATA_DIR to the external raw data directory in .env or shell.
    qfq_zip: "${A_SHARE_DATA_DIR}/daily_qfq.zip"
    bfq_zip: "${A_SHARE_DATA_DIR}/daily.zip"
    stock_list_csv: "${A_SHARE_DATA_DIR}/股票列表.csv"
    trading_calendar_csv: "${A_SHARE_DATA_DIR}/交易日历.csv"
    delisted_stock_csv: "${A_SHARE_DATA_DIR}/退市股票列表.csv"
    index_list_csv: "${A_SHARE_DATA_DIR}/指数/指数列表.csv"
    csi_index_list_csv: "${A_SHARE_DATA_DIR}/指数/中证指数列表.csv"
    index_daily_zip: "${A_SHARE_DATA_DIR}/指数/指数_日_kline.zip"
    csi_index_daily_zip: "${A_SHARE_DATA_DIR}/指数/中证指数_日_kline.zip"
    output_db: "data/a_share_history.sqlite"
    years: 10
    chunk_size: 250000
  data_sources:
    fred:
      enabled: true
      api_key_env: "FRED_API_KEY"
      cache:
        enabled: true
        dir: "data/cache/fred"
        ttl_hours: 24
      series:
        gdp: "GDP"
        cpi: "CPIAUCSL"
        fedfunds: "FEDFUNDS"
        fedfunds_daily: "DFF"
        vix: "VIXCLS"
    tiingo:
      enabled: true
      token_env: "TIINGO_API_TOKEN"
      us_equities:
        - "NVDA"
        - "AAPL"
        - "TSLA"
      thematic_etfs:
        - "KWEB"
    yfinance:
      us_indices:
        - "^NDX"
        - "^SOX"
        - "^GSPC"
        - "^VIX"
      us_equities:
        - "NVDA"
        - "AAPL"
        - "TSLA"
      thematic_etfs:
        - "KWEB"
      cnh_proxy:
        - "CNY=X"
    tushare:
      enabled: true
      token_env: "TUSHARE_TOKEN"
      api_url: "http://api.tushare.pro"
      request_delay: 0.25
      max_retries: 3
      retry_backoff: 2
      min_coverage: 0.80
    akshare:
      anti_crawler:
        enabled: true
        request_delay: 0.8
        jitter: 0.4
        batch_size: 5
        batch_pause: 6
        max_retries: 1
        retry_backoff: 4
      cn_symbols:
        - "SZ.300750"
        - "SH.600519"
      hk_symbols:
        - "HK.00700"
        - "HK.09988"
  intelligence:
    ledger: "knowledge/intelligence/strategy_intelligence_ledger.csv"
    inbox_dir: "data/intelligence/inbox"
    report_dir: "archive/intelligence"
    sources:
      - name: "local_papers"
        type: "local_dir"
        enabled: true
        path: "refdocs/papers"
      - name: "logseq_pages"
        type: "local_dir"
        enabled: false
        path: "/home/zj/workspace/KMS/My_logseq/pages"
      - name: "arxiv_quant_finance"
        type: "arxiv"
        enabled: true
        query: "all:quantitative finance stock trading strategy"
      - name: "openalex_quant_strategy"
        type: "openalex"
        enabled: true
        query: "quantitative investment stock strategy"
      - name: "crossref_quant_strategy"
        type: "crossref"
        enabled: true
        query: "quantitative investment stock strategy"
      - name: "rss_quantocracy"
        type: "rss"
        enabled: true
        url: "https://feeds.feedburner.com/Quantocracy"
  market_schedules:
    default_timezone: "Asia/Shanghai"
    markets:
      cn:
        timezone: "Asia/Shanghai"
        sessions:
          call_auction: "09:15-09:25"
          open: "09:30"
          morning_close: "11:30"
          afternoon_open: "13:00"
          close: "15:00"
        calendar:
          source: "local_db"
          database_path: "data/a_share_history.sqlite"
          table: "trading_calendar"
      us:
        timezone: "America/New_York"
        sessions:
          open: "09:30"
          close: "16:00"
        calendar:
          source: "local_db"
          database_path: "data/us_market_history.sqlite"
          table: "us_daily_bars"
          anchor_symbol: "^SOX"
      hk:
        timezone: "Asia/Hong_Kong"
        sessions:
          open: "09:30"
          close: "16:00"
        calendar:
          source: "local_db"
          database_path: "data/hk_market_history.sqlite"
          table: "hk_daily_bars"
      euro_london:
        timezone: "Europe/London"
        sessions:
          open: "08:00"
          close: "16:30"
        calendar:
          source: "local_db"
          database_path: "data/euro_market_history.sqlite"
          table: "market_daily_bars"
          anchor_symbol: "^FTSE"
      euro_frankfurt:
        timezone: "Europe/Berlin"
        sessions:
          open: "09:00"
          close: "17:30"
        calendar:
          source: "local_db"
          database_path: "data/euro_market_history.sqlite"
          table: "market_daily_bars"
          anchor_symbol: "^GDAXI"
    scheduler:
      financial_factors: "03:30"
      us_market_news: "06:30"
      gov_policy: "06:50"
      daily_brief: "07:20"
      hk_opening_snapshot: "09:40"
      etf_opening_snapshot: "09:25"
      cn_finance_flash_window: "09:15-15:05"
      etf_5min_window: "09:35-15:00"
      intraday_bill_window: "09:35-15:00"
      europe_london_opening_snapshot: "16:10"
      europe_frankfurt_opening_snapshot: "16:10"
      hk_market_history: "16:20"
      a_share_history: "16:30"
      index_daily_tail: "16:35"
      account_bill_confirm: "16:45"
      us_opening_snapshot: "22:40"
      europe_london_market_history: "00:45"
      europe_frankfurt_market_history: "01:45"
      us_market_history: "05:15"
      cn_finance_flash_daily: "17:20"
      policy_event_extract: "17:40"
      data_governance_check: "17:50"
      cninfo_risk_events: "20:20"
      cctv_news: "20:45"
  maintenance_orchestrator:
    enabled: true
    state_db: "data/maintenance/maintenance.sqlite"
    default_timezone: "Asia/Shanghai"
    tushare_financial_backfill:
      shard_count: 3
      max_requests_per_minute_per_shard: 67
      default_start_period: "2018-06-30"
      default_end_period: "2026-03-31"
  walk_forward:
    preset_name: "baseline_2y_1y_5fold"
    presets:
      baseline_2y_1y:
        train_years: 2
        validate_years: 1
        description: "统一候选比较 baseline，保留与既有报告可比性。"
      baseline_2y_1y_5fold:
        train_years: 2
        validate_years: 1
        start_date: "2019-04-01"
        end_date: "2026-03-31"
        expected_folds: 5
        description: "通用策略准入 baseline；自然日期窗口，交易日历过滤，5 折验收。"
      quality_3y_1y:
        train_years: 3
        validate_years: 1
        description: "低频质量/低换手策略稳健性复核窗口。"
      quality_3y_1y_4fold:
        train_years: 3
        validate_years: 1
        start_date: "2019-04-01"
        end_date: "2026-03-31"
        expected_folds: 4
        description: "低频质量/低换手策略稳健性复核；自然日期窗口，交易日历过滤。"
      quality_4y_1y:
        train_years: 4
        validate_years: 1
        start_date: "2020-04-01"
        end_date: "2026-03-31"
        expected_folds: 2
        description: "质量/低换手策略严格复核窗口；自然日期窗口，交易日历过滤。"
    min_samples: 200
    execution:
      # Profiling is opt-in. Use `strategy-admission --profile` when diagnosing runtime.
      profile: false
      profile_output_dir: "logs/perf"
    cache:
      # Runtime cache only shares safe boundaries: raw/fold inputs and per-strategy prepared panels.
      # Prepared panels are never shared across different strategy IDs/configs/folds.
      enabled: true
      refresh: false
      prepared_panel:
        enabled: true
        disk_enabled: false
        dir: "data/cache/walk_forward/prepared"
      fold_panel:
        enabled: true
        disk_enabled: false
        dir: "data/cache/walk_forward/folds"
    initial_cash: 1000000
    commission: 0.00025
    stamp_duty_sell: 0.0005
    slippage: 0.00246
    gate:
      annualized_return_min: 0.0
      sharpe_min: 0.5
      max_drawdown_min: -0.25
      win_rate_min: 0.45
      oos_return_decay_ratio_max: 0.30
      oos_annualized_return_min: 0.0
      oos_sharpe_min: 0.5
      min_oos_fold_count: 2
      min_positive_fold_ratio: 0.75
      max_negative_fold_count: 1
      min_fold_annualized_return_min: -0.10
      min_oos_positive_fold_ratio: 1.0
    admission:
      # strategy_sets 是准入设计输入，不记录运行状态。
      # 一次性缩小范围优先用 CLI --strategies；下次不带该参数会回到默认集合。
      # 注释某个策略行属于持久配置变更，需要手动取消注释恢复。
      default_strategy_set: "baseline_admission_all_v1"
      strategy_sets:
        baseline_admission_all_v1:
          description: "默认全局准入策略集合；临时缩小范围优先使用 CLI --strategies 覆盖。"
