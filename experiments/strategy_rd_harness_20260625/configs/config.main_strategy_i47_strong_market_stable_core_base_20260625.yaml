      bj: 0.3
  strategy_reports:
    default_strategy_id: legacy_momentum_low_turnover_v1
    strategies:
      legacy_momentum_low_turnover_v1:
        display_name: 低换手经典动量
        bill:
          output: reports/phase0_low_turnover_bill.csv
          daily_output: reports/phase0_low_turnover_daily_assets.csv
          preview_output: reports/phase0_low_turnover_bill_preview.html
          panel_cache: reports/cache/low_turnover_panel.pkl
          preview_title: Phase 0 Low Turnover Bill Preview
          score_label: 策略分数
